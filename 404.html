<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
  <title>Página não encontrada - Magnum Torque</title>
  <link rel="icon" href="/favicon.ico?v=20260721" sizes="32x32">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png?v=20260721">
  <link rel="stylesheet" href="/css/fonts.css?v=20260826">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:'Open Sans','Open Sans Fallback',system-ui,sans-serif;
      background:linear-gradient(135deg,#111827 0%,#1e293b 100%);
      color:#f9fafb;
      display:flex;align-items:center;justify-content:center;
      padding:2rem;
      line-height:1.6;
    }
    .wrap{max-width:560px;text-align:center}
    .logo{font-family:'Montserrat','Montserrat Fallback',sans-serif;font-weight:800;font-size:1.75rem;margin-bottom:2rem;letter-spacing:-.02em}
    .logo span{color:#eb060f}
    h1{font-family:'Montserrat','Montserrat Fallback',sans-serif;font-size:clamp(3rem,12vw,5rem);font-weight:800;color:#eb060f;line-height:1;margin-bottom:.5rem}
    h2{font-family:'Montserrat','Montserrat Fallback',sans-serif;font-size:clamp(1.25rem,4vw,1.75rem);font-weight:700;margin-bottom:1rem}
    p{color:#d1d5db;margin-bottom:2rem}
    .btn{
      display:inline-flex;align-items:center;gap:.5rem;
      background:#eb060f;color:#fff;text-decoration:none;
      padding:.875rem 2rem;border-radius:.75rem;
      font-weight:600;font-size:1rem;
      transition:background .2s;
    }
    .btn:hover,.btn:focus{background:#c9050d}
    /* #9ca3af = --gray-400. Era #888, que dava 4,40:1 sobre o gradiente e falhava
       AA em toda posição (14px/400 exige 4,5). Agora 6,2:1. Literal de propósito:
       esta página não carrega style.css e não tem :root — qualquer var() aqui
       resolve inválido e derruba a declaração inteira. */
    .countdown{font-size:.875rem;color:#9ca3af;margin-top:1.5rem}
  </style>
  <script src="/js/404.js?v=20260826"></script>
</head>
<body>
  <div class="wrap">
    <div class="logo">Magnum <span>Torque</span></div>
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>A página que você procura não existe ou foi movida. Vamos te levar de volta ao site.</p>
    <a href="/" class="btn" id="home-btn">Ir para a página inicial</a>
    <p class="countdown" id="countdown">Redirecionando em <span id="secs">20</span> segundos...</p>
  </div>
</body>
</html>
